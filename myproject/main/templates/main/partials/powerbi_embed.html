{% if powerbi_embed_url %}
<div class="bg-white rounded-2xl ring-1 ring-slate-100 shadow-sm p-6 mb-6">
  <div class="flex items-baseline justify-between flex-wrap gap-2 mb-4">
    <h2 class="font-black text-slate-900">{{ pbi_title|default:"LearnMate AI 學習診斷儀表板（Power BI）" }}</h2>
    {% if pbi_note %}<p class="text-xs text-slate-500">{{ pbi_note }}</p>{% endif %}
  </div>
  <div class="relative w-full overflow-hidden rounded-xl" style="padding-top:56.25%;">
    <iframe title="LearnMate AI 學習診斷儀表板" src="{{ powerbi_embed_url }}"
            class="absolute inset-0 w-full h-full border-0" loading="lazy" allowfullscreen></iframe>
  </div>
</div>
{% endif %}
